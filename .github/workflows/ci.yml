name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: 一致性校验与后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: 数值基线生成物与真源一致
        working-directory: tools/genbaseline
        run: go run . -check

      - name: 共享 schema 校验
        run: python3 scripts/validate_schemas.py

      - name: Go 后端测试
        working-directory: server
        run: go test ./...
