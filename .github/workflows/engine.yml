name: engine-build

on:
  workflow_dispatch:
  push:
    tags:
      - "engine-*"

jobs:
  linux-editor:
    name: Linux 编辑器（可 headless）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-pip \
            libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev

      - name: 安装 SCons
        run: python3 -m pip install "scons>=4.8"

      - name: 拉取引擎源码
        run: bash scripts/setup-engine.sh

      - name: 构建编辑器
        run: bash scripts/build-engine.sh editor

      - name: 上传编辑器产物
        uses: actions/upload-artifact@v4
        with:
          name: lifetext-editor-linux
          path: engine/bin/godot.linuxbsd.editor.x86_64
          if-no-files-found: error

  windows-template:
    name: Windows 导出模板
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 SCons
        run: python -m pip install "scons>=4.8"

      - name: 拉取引擎源码
        shell: bash
        run: bash scripts/setup-engine.sh

      - name: 安装图形依赖（AccessKit / D3D12）
        shell: bash
        working-directory: engine
        run: |
          python misc/scripts/install_accesskit.py
          python misc/scripts/install_d3d12_sdk_windows.py

      - name: 构建 Windows 导出模板
        shell: bash
        env:
          PLATFORM: windows
        run: bash scripts/build-engine.sh template_release

      - name: 安装官方编辑器（导出验证用）
        shell: pwsh
        run: |
          $ver = "4.7.2-stable"
          $url = "https://github.com/godotengine/godot/releases/download/$ver/Godot_v${ver}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\editor.zip"
          Expand-Archive "$env:RUNNER_TEMP\editor.zip" -DestinationPath "$env:RUNNER_TEMP\editor" -Force
          "GODOT_BIN=$env:RUNNER_TEMP\editor\Godot_v${ver}_win64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TPL_DIR=$env:APPDATA\Godot\export_templates\4.7.2.stable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 以自定义模板导出并冒烟运行客户端
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:TPL_DIR | Out-Null
          Copy-Item "engine/bin/godot.windows.template_release.x86_64.exe" "$env:TPL_DIR\windows_release_x86_64.exe" -Force
          & $env:GODOT_BIN --headless --path client --import
          New-Item -ItemType Directory -Force -Path "client/build/windows" | Out-Null
          & $env:GODOT_BIN --headless --path client --export-release "Windows Desktop" "build/windows/lifetext.exe"
          Get-ChildItem "client/build/windows" | Format-Table Name, Length
          & "client/build/windows/lifetext.exe" --headless --quit-after 60
          if ($LASTEXITCODE -ne 0) { throw "导出程序退出码 $LASTEXITCODE" }

      - name: 上传导出模板产物
        uses: actions/upload-artifact@v4
        with:
          name: lifetext-template-windows
          path: engine/bin/godot.windows.template_release.x86_64.exe
          if-no-files-found: error
