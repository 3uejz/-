openapi: 3.1.0
info:
  title: 浮生录 Life Text Sandbox API
  version: "1.0.0"
  description: |
    客户端（Godot）与后端（Go 模块化单体）之间的 REST 接口。
    通用约定见 `../conventions.md`；数据结构见 `../schemas/`。
    鉴权：`Authorization: Bearer <access JWT>`；refresh 用于换取新 access。
servers:
  - url: /api/v1
    description: 私有服务器（同源，经反向代理）
tags:
  - name: auth
  - name: saves
  - name: content
  - name: legacy
  - name: telemetry
  - name: world
  - name: admin

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: 注册账号
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌（轮换 refresh）
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 新令牌对
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出并撤销当前 refresh
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: "已登出" }

  /saves:
    get:
      tags: [saves]
      summary: 列出存档槽
      operationId: listSaves
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: 存档槽列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSlotPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /saves/{slot}:
    parameters:
      - { $ref: "#/components/parameters/Slot" }
    get:
      tags: [saves]
      summary: 下载指定槽最新存档
      operationId: getSave
      responses:
        "200":
          description: 存档文档
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "../schemas/save.schema.json" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      tags: [saves]
      summary: 上传存档（乐观锁 + 幂等键）
      operationId: putSave
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/save.schema.json" }
      responses:
        "200":
          description: 覆盖成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSlot" }
        "201":
          description: 新建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSlot" }
        "409": { $ref: "#/components/responses/Conflict" }

  /saves/{slot}/versions:
    get:
      tags: [saves]
      summary: 列出存档历史版本
      operationId: listSaveVersions
      parameters:
        - { $ref: "#/components/parameters/Slot" }
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SaveVersion" }

  /saves/{slot}/rollback:
    post:
      tags: [saves]
      summary: 回滚到指定版本
      operationId: rollbackSave
      parameters:
        - { $ref: "#/components/parameters/Slot" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 回滚后的槽
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSlot" }
        "409": { $ref: "#/components/responses/Conflict" }

  /saves/{slot}/resolve:
    post:
      tags: [saves]
      summary: 解决本地/云端冲突
      operationId: resolveSaveConflict
      parameters:
        - { $ref: "#/components/parameters/Slot" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution]
              properties:
                resolution: { type: string, enum: [keep_local, keep_cloud, merge] }
                cloud_version: { type: integer, minimum: 1 }
                local_blob: { type: object }
      responses:
        "200":
          description: 解决结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveSlot" }
        "409": { $ref: "#/components/responses/Conflict" }

  /content/manifest:
    get:
      tags: [content]
      summary: 获取内容清单
      operationId: getContentManifest
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: 内容清单
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "../schemas/content-manifest.schema.json" }
        "304": { description: "未修改" }

  /config:
    get:
      tags: [content]
      summary: 获取远程配置
      operationId: getRemoteConfig
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: 远程配置
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "../schemas/remote-config.schema.json" }
        "304": { description: "未修改" }

  /announcements:
    get:
      tags: [content]
      summary: 获取生效公告
      operationId: listAnnouncements
      responses:
        "200":
          description: 公告列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Announcement" }

  /legacy:
    get:
      tags: [legacy]
      summary: 读取传承档案
      operationId: getLegacy
      responses:
        "200":
          description: 传承档案
          content:
            application/json:
              schema: { $ref: "../schemas/legacy.schema.json" }
    put:
      tags: [legacy]
      summary: 写入传承档案
      operationId: putLegacy
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/legacy.schema.json" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "../schemas/legacy.schema.json" }
        "409": { $ref: "#/components/responses/Conflict" }

  /telemetry/events:
    post:
      tags: [telemetry]
      summary: 批量上报遥测（按 event_id 去重）
      operationId: postTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 500
                  items: { $ref: "../schemas/telemetry.schema.json" }
      responses:
        "202":
          description: 接收结果（逐条）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, rejected]
                properties:
                  accepted: { type: array, items: { $ref: "../schemas/common.schema.json#/$defs/uuid" } }
                  rejected:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [event_id, code]
                      properties:
                        event_id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
                        code: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /world/summary:
    get:
      tags: [world]
      summary: 获取全球人口与宏观摘要
      operationId: getWorldSummary
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: 世界摘要
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "../schemas/worldsim.schema.json" }
        "304": { description: "未修改" }

  /world/sync:
    post:
      tags: [world]
      summary: 上传本地近似并合并权威结果
      operationId: syncWorld
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/worldsim.schema.json" }
      responses:
        "200":
          description: 合并后的权威摘要
          content:
            application/json:
              schema: { $ref: "../schemas/worldsim.schema.json" }

  /admin/me:
    get:
      tags: [admin]
      summary: 当前管理员信息与权限
      operationId: adminMe
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/dashboard/summary:
    get:
      tags: [admin]
      summary: 仪表盘汇总
      operationId: adminDashboardSummary
      responses:
        "200": { description: 仪表盘汇总 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts:
    get:
      tags: [admin]
      summary: 账号列表（admin）
      operationId: adminListAccounts
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: q
          in: query
          schema: { type: string, description: 按用户名模糊搜索 }
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: 账号分页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts/{id}:
    get:
      tags: [admin]
      summary: 账号详情
      operationId: adminAccountDetail
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
      responses:
        "200": { description: 账号详情 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts/{id}/disable:
    post:
      tags: [admin]
      summary: 封禁账号
      operationId: adminDisableAccount
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
      responses:
        "200":
          description: 已封禁
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts/{id}/enable:
    post:
      tags: [admin]
      summary: 解封账号
      operationId: adminEnableAccount
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
      responses:
        "200":
          description: 已解封
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts/{id}/devices:
    get:
      tags: [admin]
      summary: 账号设备列表
      operationId: adminAccountDevices
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
      responses:
        "200": { description: 设备列表 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/accounts/{id}/devices/{device_id}/revoke:
    post:
      tags: [admin]
      summary: 吊销设备 refresh
      operationId: adminRevokeDevice
      parameters:
        - { $ref: "#/components/parameters/AdminId" }
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "204": { description: 已吊销 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/saves:
    get:
      tags: [admin]
      summary: 存档列表（全库）
      operationId: adminListSaves
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: 存档槽位快照 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/saves/{id}:
    get:
      tags: [admin]
      summary: 存档详情（id 为 account_id:slot）
      operationId: adminSaveDetail
      parameters:
        - { $ref: "#/components/parameters/AdminSaveId" }
      responses:
        "200": { description: 存档详情 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/saves/{id}/versions:
    get:
      tags: [admin]
      summary: 存档历史版本
      operationId: adminSaveVersions
      parameters:
        - { $ref: "#/components/parameters/AdminSaveId" }
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SaveVersion" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/saves/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚存档到指定版本
      operationId: adminSaveRollback
      parameters:
        - { $ref: "#/components/parameters/AdminSaveId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: 已回滚 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/storage/usage:
    get:
      tags: [admin]
      summary: 存储占用
      operationId: adminStorageUsage
      responses:
        "200": { description: 占用统计 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/storage/gc:
    post:
      tags: [admin]
      summary: 孤儿对象清理
      operationId: adminStorageGC
      responses:
        "202": { description: 已受理 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/packs:
    get:
      tags: [admin]
      summary: 内容包列表
      operationId: adminContentPacks
      responses:
        "200": { description: 内容包列表 }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: 上传内容包并合入清单
      operationId: adminContentPackUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPack" }
      responses:
        "201": { description: 已上传 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/packs/{name}/validate:
    post:
      tags: [admin]
      summary: 校验内容包
      operationId: adminContentValidate
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 校验报告 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/publish:
    post:
      tags: [admin]
      summary: 发布内容包清单（admin）
      operationId: adminPublishContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/content-manifest.schema.json" }
      responses:
        "202": { description: 已受理发布 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/releases:
    get:
      tags: [admin]
      summary: 发布批次列表
      operationId: adminListReleases
      responses:
        "200": { description: 发布批次列表 }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: 创建灰度发布批次
      operationId: adminCreateRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentRelease" }
      responses:
        "201": { description: 已创建 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/releases/{id}/pause:
    post:
      tags: [admin]
      summary: 暂停放量
      operationId: adminPauseRelease
      parameters: [ { $ref: "#/components/parameters/ReleaseId" } ]
      responses:
        "200": { description: 已暂停 }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/releases/{id}/resume:
    post:
      tags: [admin]
      summary: 继续放量
      operationId: adminResumeRelease
      parameters: [ { $ref: "#/components/parameters/ReleaseId" } ]
      responses:
        "200": { description: 已继续 }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/content/releases/{id}/rollback:
    post:
      tags: [admin]
      summary: 回滚发布
      operationId: adminRollbackRelease
      parameters: [ { $ref: "#/components/parameters/ReleaseId" } ]
      responses:
        "200": { description: 已回滚 }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/config:
    get:
      tags: [admin]
      summary: 读取远程配置（含当前版本与 revision）
      operationId: adminGetConfig
      responses:
        "200":
          description: 当前配置版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: 编辑并发布远程配置（乐观锁）
      operationId: adminPutConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                revision: { type: integer, minimum: 0 }
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigVersion" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/config/versions:
    get:
      tags: [admin]
      summary: 配置版本历史
      operationId: adminConfigVersions
      responses:
        "200": { description: 版本历史 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/config/rollback:
    post:
      tags: [admin]
      summary: 回滚配置到历史版本
      operationId: adminConfigRollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: 已回滚 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/announcements:
    get:
      tags: [admin]
      summary: 公告列表
      operationId: adminListAnnouncements
      responses:
        "200": { description: 公告列表 }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: 新建公告
      operationId: adminCreateAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncement" }
      responses:
        "201": { description: 已创建 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/announcements/{id}:
    put:
      tags: [admin]
      summary: 编辑公告
      operationId: adminUpdateAnnouncement
      parameters: [ { $ref: "#/components/parameters/AdminId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAnnouncement" }
      responses:
        "200": { description: 已更新 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin]
      summary: 删除公告
      operationId: adminDeleteAnnouncement
      parameters: [ { $ref: "#/components/parameters/AdminId" } ]
      responses:
        "204": { description: 已删除 }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/telemetry/events:
    get:
      tags: [admin]
      summary: 遥测明细
      operationId: adminTelemetryEvents
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: event_type
          in: query
          schema: { type: string }
      responses:
        "200": { description: 遥测明细 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/telemetry/aggregates:
    get:
      tags: [admin]
      summary: 遥测日聚合
      operationId: adminTelemetryAggregates
      responses:
        "200": { description: 聚合结果 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/telemetry/life-stats:
    get:
      tags: [admin]
      summary: 人生统计
      operationId: adminTelemetryLifeStats
      responses:
        "200": { description: 人生统计 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/telemetry/export:
    post:
      tags: [admin]
      summary: 导出遥测
      operationId: adminTelemetryExport
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
        - name: account_id
          in: query
          schema: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
      responses:
        "200": { description: 导出结果 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/telemetry/purge:
    post:
      tags: [admin]
      summary: 合规删除遥测
      operationId: adminTelemetryPurge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
                before: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
      responses:
        "200": { description: 已删除 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-logs:
    get:
      tags: [admin]
      summary: 审计日志
      operationId: adminAuditLogs
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: action
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: target
          in: query
          schema: { type: string }
      responses:
        "200": { description: 审计日志 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assistant/status:
    get:
      tags: [admin]
      summary: 运营助手状态
      operationId: adminAssistantStatus
      responses:
        "200": { description: 状态（默认关闭） }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assistant/query:
    post:
      tags: [admin]
      summary: 运营助手查询
      operationId: adminAssistantQuery
      responses:
        "200": { description: 查询结果 }
        "503": { description: 运营助手未启用 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/assistant/draft:
    post:
      tags: [admin]
      summary: 生成内容草稿
      operationId: adminAssistantDraft
      responses:
        "200": { description: 草稿 }
        "503": { description: 运营助手未启用 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/system/status:
    get:
      tags: [admin]
      summary: 系统状态
      operationId: adminSystemStatus
      responses:
        "200": { description: 组件状态与密钥存在性 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/system/backups:
    get:
      tags: [admin]
      summary: 备份列表
      operationId: adminSystemBackups
      responses:
        "200": { description: 备份列表 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/system/backup:
    post:
      tags: [admin]
      summary: 手动触发备份
      operationId: adminSystemBackup
      responses:
        "202": { description: 已触发 }
        "503": { description: 备份未启用 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/system/migrations:
    get:
      tags: [admin]
      summary: 迁移版本
      operationId: adminSystemMigrations
      responses:
        "200": { description: 已内置迁移列表 }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Slot:
      name: slot
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 99 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    AdminId:
      name: id
      in: path
      required: true
      schema: { type: string, description: "资源 ID。" }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }
    AdminSaveId:
      name: id
      in: path
      required: true
      schema: { type: string, description: "存档 ID，形如 account_id:slot。" }
    ReleaseId:
      name: id
      in: path
      required: true
      schema: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string, description: "上次响应的 ETag。" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }

  headers:
    ETag:
      schema: { type: string }

  responses:
    ValidationError:
      description: 校验失败
      content:
        application/json:
          schema: { $ref: "../schemas/common.schema.json#/$defs/error" }
    Unauthenticated:
      description: 未认证或令牌失效
      content:
        application/json:
          schema: { $ref: "../schemas/common.schema.json#/$defs/error" }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: "../schemas/common.schema.json#/$defs/error" }
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: "../schemas/common.schema.json#/$defs/error" }
    Conflict:
      description: 冲突（版本、哈希、幂等或存档冲突）
      content:
        application/json:
          schema: { $ref: "../schemas/common.schema.json#/$defs/error" }

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: "access 有效期（秒）。" }
        account_id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
    SaveSlot:
      type: object
      additionalProperties: false
      required: [slot, version, hash, updated_at]
      properties:
        slot: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        playthrough_id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        updated_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    SaveSlotPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SaveSlot" } }
        next_cursor: { type: [string, "null"] }
    SaveVersion:
      type: object
      additionalProperties: false
      required: [version, hash, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    Announcement:
      type: object
      additionalProperties: false
      required: [id, title, body]
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        title: { type: string }
        body: { type: string }
        start_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
        end_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    Account:
      type: object
      additionalProperties: false
      required: [id, username, created_at]
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        username: { type: string }
        role: { type: string, enum: [player, admin] }
        disabled: { type: boolean }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    ContentPack:
      type: object
      additionalProperties: false
      required: [name, kind, version, hash, size, url]
      properties:
        name: { type: string }
        kind: { type: string, enum: [core, data, art, audio] }
        version: { type: string }
        hash: { type: string, description: "sha256:<hex>。" }
        size: { type: integer, minimum: 0 }
        url: { type: string }
        status: { type: string }
    ContentRelease:
      type: object
      additionalProperties: false
      required: [pack_name, pack_version]
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        pack_name: { type: string }
        pack_version: { type: string }
        strategy: { type: string, enum: [all, percent, accounts] }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
        account_list: { type: array, items: { $ref: "../schemas/common.schema.json#/$defs/uuid" } }
        status: { type: string, enum: [scheduled, rolling, paused, completed, rolled_back] }
        manifest_version: { type: integer, minimum: 0 }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
        updated_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    ConfigVersion:
      type: object
      additionalProperties: false
      required: [version, values]
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        version: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        values: { type: object, additionalProperties: true }
        created_by: { type: string }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    AdminAnnouncement:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        title: { type: string }
        body: { type: string }
        audience: { type: string, enum: [all, accounts] }
        account_list: { type: array, items: { $ref: "../schemas/common.schema.json#/$defs/uuid" } }
        start_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
        end_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
        status: { type: string, enum: [draft, scheduled, published, offline] }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
        updated_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        actor_account_id: { $ref: "../schemas/common.schema.json#/$defs/uuid" }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        result: { type: string, enum: [ok, error] }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { $ref: "../schemas/common.schema.json#/$defs/timestamp" }
